name: 缺陷
description: 报告一个可复现的缺陷
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 触发缺陷的最短步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Godot 版本、模组与存档等
    validations:
      required: true
