name: issue-archive
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node Tools/issue-archive.mjs --out "$RUNNER_TEMP/archive"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin issue-archive > /dev/null 2>&1; then
            git fetch origin issue-archive
            git checkout -B issue-archive FETCH_HEAD
          else
            git checkout --orphan issue-archive
          fi
          git rm -rf . > /dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP/archive/." .
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: $(date -u +%FT%TZ)"
          git push origin issue-archive
